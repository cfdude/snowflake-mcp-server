[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowflake-mcp-server"
version = "1.0.0"
description = "MCP server for performing read-only operations against Snowflake"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.0.0",
    "snowflake-connector-python>=3.8.0",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "anyio>=3.7.1",
    "sqlglot>=11.5.5",
    "aiofiles>=23.2.0",
]

[project.scripts]
snowflake-mcp = "snowflake_mcp_server.run_stdio:main"
snowflake-mcp-stdio = "snowflake_mcp_server.run_stdio:main"
snowflake-mcp-http = "snowflake_mcp_server.run_http:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23.0",
]
